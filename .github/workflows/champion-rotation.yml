name: Champion rotation C/D monitor
on:
  push:
    branches: [main]
    paths:
      - "champion_rotation/monitor.py"
      - "champion_rotation/test_monitor.py"
      - "champion_rotation/requirements.txt"
      - ".github/workflows/champion-rotation.yml"
  schedule:
    # 23:30 UTC = 19:30 ET during daylight saving, 18:30 ET in winter.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: champion-rotation-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: champion_rotation/requirements.txt
      - run: pip install -r champion_rotation/requirements.txt
      - name: Unit-test C/D signal transitions
        run: python -m unittest champion_rotation.test_monitor
      - name: Scan and write research report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python -m champion_rotation.monitor
      - name: Persist report and next-run tracking state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champion_rotation/state.json champion_rotation/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update C/D champion research report"
            git push
          fi
